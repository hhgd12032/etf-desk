name: Update hot.json

on:
  schedule:
    - cron: '0 0 * * *'      # 每天 UTC 00:00 = 台北 08:00
  workflow_dispatch:          # 也可在 Actions 頁手動按一次

permissions:
  contents: write             # 允許把 hot.json commit 回 repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build hot.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/build_hot.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hot.json
          git commit -m "chore: update hot.json ($(date -u +%F))" || echo "no changes"
          git push
